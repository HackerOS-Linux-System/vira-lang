<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>HackerTodo</title>
  <style>
    :root { --bg:#0d0d0d; --surf:#161616; --border:#2a2a2a; --accent:#00ff88; --text:#e8e8e8; --muted:#555; --danger:#ff4444; --warn:#ffaa00; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; min-height:100vh; }
    .app { max-width:680px; margin:0 auto; padding:32px 16px; }
    h1 { color:var(--accent); font-size:22px; margin-bottom:4px; }
    .subtitle { color:var(--muted); font-size:12px; margin-bottom:24px; }
    .input-row { display:flex; gap:8px; margin-bottom:16px; }
    .input-row input { flex:1; background:var(--surf); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:13px; padding:10px 14px; border-radius:6px; outline:none; }
    .input-row input:focus { border-color:var(--accent); }
    .btn { background:var(--accent); color:#000; border:none; border-radius:6px; font-family:inherit; font-size:12px; font-weight:700; padding:10px 18px; cursor:pointer; }
    .btn:hover { opacity:.85; }
    .btn-sm { background:var(--surf); color:var(--text); border:1px solid var(--border); border-radius:4px; font-family:inherit; font-size:11px; padding:4px 10px; cursor:pointer; }
    .btn-sm:hover { border-color:var(--accent); }
    .filters { display:flex; gap:6px; margin-bottom:20px; }
    .filter { background:none; border:1px solid var(--border); color:var(--muted); font-family:inherit; font-size:11px; padding:4px 12px; border-radius:20px; cursor:pointer; }
    .filter.active { border-color:var(--accent); color:var(--accent); }
    .todo-item { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surf); border:1px solid var(--border); border-radius:6px; margin-bottom:6px; }
    .todo-item.done .todo-text { opacity:.4; text-decoration:line-through; }
    .check { width:18px; height:18px; border:1px solid var(--border); border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .check.done { background:var(--accent); border-color:var(--accent); color:#000; }
    .todo-text { flex:1; font-size:13px; }
    .prio { font-size:10px; padding:2px 6px; border-radius:3px; }
    .prio-low { background:#1a2a1a; color:#4a9; }
    .prio-medium { background:#2a2210; color:var(--warn); }
    .prio-high { background:#2a1010; color:var(--danger); }
    .del-btn { background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:2px 6px; }
    .del-btn:hover { color:var(--danger); }
    .footer { margin-top:16px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--muted); }
    select { background:var(--surf); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:12px; padding:6px 10px; border-radius:6px; }
  </style>
</head>
<body>
<div class="app">
  <h1>// HackerTodo</h1>
  <p class="subtitle">Napisane w Vira → Tauri</p>

  <div class="input-row">
    <input id="input" placeholder="Nowe zadanie..." onkeydown="if(e.key==='Enter')addTodo()" />
    <select id="prio">
      <option value="low">Niski</option>
      <option value="medium" selected>Średni</option>
      <option value="high">Wysoki</option>
      <option value="critical">Krytyczny</option>
    </select>
    <button class="btn" onclick="addTodo()">+ Dodaj</button>
  </div>

  <div class="filters">
    <button class="filter active" onclick="setFilter('all',this)">Wszystkie</button>
    <button class="filter" onclick="setFilter('active',this)">Aktywne</button>
    <button class="filter" onclick="setFilter('done',this)">Ukończone</button>
  </div>

  <div id="list"></div>

  <div class="footer">
    <span id="counter">0 pozostałych</span>
    <button class="btn-sm" onclick="clearDone()">Usuń ukończone</button>
  </div>
</div>

<script>
const { invoke } = window.__TAURI__.tauri;
let currentFilter = 'all';

async function load() {
  const todos = await invoke('get_todos', { filter: currentFilter });
  const list = document.getElementById('list');
  list.innerHTML = todos.length ? todos.map(t => `
    <div class="todo-item ${t.done ? 'done' : ''}">
      <div class="check ${t.done ? 'done' : ''}" onclick="toggle(${t.id})">${t.done ? '✓' : ''}</div>
      <span class="todo-text">${esc(t.text)}</span>
      <span class="prio prio-${t.priority.toLowerCase?.() || 'low'}">${t.priority}</span>
      <button class="del-btn" onclick="del(${t.id})">✕</button>
    </div>`).join('') : '<p style="color:var(--muted);text-align:center;padding:20px">Brak zadań</p>';

  const stats = await invoke('get_stats', { filter: 'all' });
  const remaining = stats.todos.filter(t => !t.done).length;
  document.getElementById('counter').textContent = `${remaining} pozostałych`;
}

async function addTodo() {
  const text = document.getElementById('input').value.trim();
  const prio = document.getElementById('prio').value;
  if (!text) return;
  await invoke('add_todo', { text, priority: prio, tags: [] });
  document.getElementById('input').value = '';
  load();
}

async function toggle(id) { await invoke('toggle_todo', { id }); load(); }
async function del(id) { await invoke('delete_todo', { id }); load(); }
async function clearDone() { await invoke('clear_done'); load(); }

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  load();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

load();
</script>
</body>
</html>

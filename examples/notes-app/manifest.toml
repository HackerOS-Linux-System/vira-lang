[app]
name        = "hacker-notes"
version     = "0.1.0"
identifier  = "pl.hackeros.hacker-notes"
description = "HackerNotes for HackerOS"

[window]
title   = "HackerNotes"
width   = 1100
height  = 700
resizable   = true
decorations = true
transparent = false

[bundle]
# Set to false to skip icon requirement (Vira will generate a placeholder)
icons = true
# targets: "all" | "deb" | "appimage" | "msi" | "app" | "dmg"
targets = "all"

[build]
# Path to lib/ directory containing UI (relative to project root)
# UI can be written in .vira or .html
ui_dir = "lib"

[dev]
# Port for dev server (if using lib/*.vira UI with hot-reload)
port = 1420
